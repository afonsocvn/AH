    temperatura_media_c: 32
    temperatura_max_c: 35
    calorias: 2317
    fonte: "Coros Pace 3 (.fit)"
    splits_km:
      resumo: >
        36 splits de 1km (último parcial, 16m). Pace estável entre 5:15 e
        5:95/km ao longo de quase todo o treino, sem quebras de forma como
        no Cascais. FC sobe de forma constante e acentuada: ~125bpm no km1
        até 174-181bpm nos últimos km, com o pace a manter-se — decoupling
        claro, mas desta vez sem colapso de pace/cadência (cadência
        manteve-se 81-86 do início ao fim, nunca caiu para os 77-80 que se
        viu no Cascais). Potência também sobe gradualmente de ~150W para
        ~165-176W ao longo do treino, coerente com a subida de FC. Soma dos
        primeiros 21 splits (~21km) = ~1:58:34 — referência de ritmo de meia
        maratona, mas NÃO é um esforço máximo: foi o troço inicial de um
        treino de 35km a ritmo controlado, não uma tentativa a sério de PB.
    fueling_planeado_vs_executado:
      plano: "ver data/objetivos.yaml -> plano_fueling_longo_grande"
      eletrolitos_pre_treino: "tomados só ~30min antes (plano era 1.5-2h antes) — menos tempo de absorção que o ideal"
      resultado: "géis correram bem, sem enjoos desta vez — plano ajustado (hydrogel, água a acompanhar, sódio a meio, cafeína espaçada) parece ter resolvido o problema do Cascais"
    tempo_parado_22min: "confirmado: foi só para tirar uma fotografia (ia acompanhado), não paragem por fadiga/física — podia ter continuado sem problemas. Isto reforça que a previsão baseada no tempo em movimento (não no tempo total) é a leitura mais fiável da capacidade real."
    notas: >
      Estava um pouco constipado e fazia calor (32°C média, até 35°C),
      mas fisicamente correu bastante bem. Não bateu no "muro" como no
      Cascais — só começou a sentir a fadiga por volta do km35 (pode ser
      mais mental, por saber que estava a acabar, do que fisiológico). BPM
      mais alto do que o ideal mas aguentou bem. Sem dores (Aquiles/joelho
      silenciosos). Chegou à distância-alvo (~35km) com pace consistente,
      o que é uma melhoria clara face ao Cascais (31.28km) em termos de
      resistência de duração — apesar de calor pior e de estar doente.

