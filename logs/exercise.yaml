    fonte: "Coros Pace 3"
    nutricao:
      doses:
        - km: 7
          tempo: "~00:39:00"
          item: "gel"
        - km: 14
          tempo: "~01:23:00"
          item: "banana"
          nota: "provável causa da dor de barriga no km16-18 (12-25min depois)"
        - km: "16-17"
          tempo: "~01:35-01:42"
          item: "gel"
        - km: 24
          tempo: "~02:24:00"
          item: "gel com cafeína"
      hidratacao: "a primeira água (início do treino) já tinha eletrólitos"
      analise: >
        Total ~90-100g hidratos em 3h07 (~30g/h) — abaixo do recomendado
        (60-90g/h) para esforço >2.5-3h. Gap de 43min sem hidratos entre o
        km24 e a meta coincide com a zona de maior decoupling (FC 158-173,
        pace instável). Eletrólitos já presentes desde o início (pelo menos
        na primeira água), por isso o enjoo do final não parece ser défice
        de sódio logo de início — mais provável ser efeito acumulado do
        calor + géis sem água suficiente. A rever: subir dose, tomas mais
        frequentes (20-25min), tirar fruta inteira do plano, garantir fuel
        no troço final.
    notas: >
      Previsão de 23-24°C mas sensação de calor seco muito forte e sem vento
      nos primeiros ~13km — mal-estar de calor no início. Melhorou muito
      depois de se refrescar; a partir daí molhou sempre o chapéu nos
      abastecimentos. Dor de barriga por volta do km 16-18 causada por uma
      banana (a evitar/reduzir em treinos e na prova). As 3 paragens longas
      (splits 14, 22, 27) foram para ir buscar água ao carro — não
      representativas do que fará em prova. Enjoos sentidos no final,
      provavelmente calor acumulado + géis sem água suficiente, mais do que
      intolerância aos géis em si. Primeira vez a correr mais de 20km —
      apareceram dores no tendão de Aquiles e no joelho nos dias seguintes
      (ver logs/lesoes.yaml). Corredor já habituado a treinar com bastante
      calor e que aguenta bem até ~20km sem quebrar — a quebra tardia deste
      treino aponta para limitador de duração/glicogénio, não intolerância
      ao calor.

