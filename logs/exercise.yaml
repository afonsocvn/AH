    calorias: 1889
    fonte: "Coros Pace 3 (.fit)"
    splits_km:
      resumo: >
        28 splits de 1km (último parcial, 240m). Temperatura bem mais
        fresca que nos treinos de verão (22-27°C vs 30-35°C), mas a FC
        esteve anormalmente alta desde muito cedo: já 160-181bpm entre o
        km2 e o km20, com o pace a manter-se perto do planeado (5:45-5:80
        min/km) — ou seja, o esforço percebido/cardíaco estava muito acima
        do que o pace justificava, consistente com estar doente, não com
        calor ou esforço excessivo de pace. A partir do km21 (perto da meia
        maratona) começam sinais claros de deterioração: lap21 já mais
        lento (6:01/km), lap22 colapsa (7:66/km, cadência cai de 84 para
        71, potência cai de ~161W para 119W) — provável início da dor
        aguda no Aquiles. Dos km23-27 o atleta tenta continuar em ondas
        (recupera um pouco, piora outra vez): paces entre 5:98 e 7:84/km,
        cadência a oscilar entre 75-86. O último troço (240m) é
        essencialmente a andar/coxear — pace equivalente a 23:15/km,
        cadência 32, potência 40W — antes da desistência aos 27.24km.
    notas: >
      "No hard feelings, just not my day." Estava doente, começou logo
      com FC muito elevada para o pace (sinal claro de doença, não de
      calor — a temperatura estava bem mais baixa que nos treinos de
      verão). Dor progressiva no tendão de Aquiles a partir de perto da
      meia maratona, piorando ao longo de vários km (confirmado pelos
      dados: colapso de cadência/potência a partir do km22) até à
      desistência aos 27.24km. Possível continuação do episódio de
      calcanhar sinalizado em 2026-10-01 (ver logs/lesoes.yaml) — por
      confirmar se chegou a ser avaliado por um médico antes da prova.
      Decisão de desistir foi a correta dado o quadro (doença + FC quase
      máxima + lesão a agravar).
